<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>KALLAX step by step in 3D · unofficial demo</title>
<meta name="description" content="An unofficial, independent demo: a picture-only assembly manual turned into a step-by-step 3D guide.">
<style>
  :root { --bg:#f4f1ec; --card:#ffffff; --ink:#22242a; --mute:#6b6f76; --line:#e4dfd6; --accent:#e07a12; --accent-ink:#ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#17181b; --card:#212327; --ink:#f1efe9; --mute:#a3a7ae; --line:#34373d; --accent:#f08a24; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif; }
  a { color:inherit; }
  header { display:flex; align-items:center; gap:12px; padding:18px 24px 6px; flex-wrap:wrap; max-width:1500px; margin:0 auto; }
  header h1 { font-size:20px; margin:0; font-weight:600; }
  .badge { font-size:12px; font-weight:600; letter-spacing:.02em; border:1px solid var(--line); border-radius:6px; padding:2px 8px; color:var(--mute); }
  .right { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .lang { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .lang button { font:inherit; font-size:14px; border:0; background:transparent; color:var(--mute); padding:5px 12px; cursor:pointer; }
  .lang button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  header .home { font-size:14px; color:var(--mute); text-decoration:none; }
  main { display:grid; align-items:start; grid-template-columns:minmax(0,1fr) 380px; gap:20px; padding:12px 24px 8px; max-width:1500px; margin:0 auto; }
  @media (max-width: 980px) { main { grid-template-columns:minmax(0,1fr); padding:12px 16px 8px; } header { padding:14px 16px 4px; } }
  .stage { background:var(--card); border-radius:18px; overflow:hidden; border:1px solid var(--line); }
  .screen { position:relative; cursor:pointer; }
  #big { position:absolute; left:50%; top:50%; width:96px; height:96px; margin:-48px 0 0 -48px; border-radius:50%; border:0; pointer-events:none;
         background:rgba(12,14,18,.62); display:grid; place-items:center; }
  #big[hidden] { display:none; }
  #big svg { width:44px; height:44px; fill:#fff; }
  #prog { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.35); }
  #prog i { display:block; height:100%; width:0; background:var(--accent); }
  #pp { min-width:44px; display:grid; place-items:center; padding:7px 10px; }
  #pp svg { width:18px; height:18px; fill:currentColor; display:block; }
  video { display:block; width:100%; aspect-ratio:16/9; background:#cbb89a; }
  #cc { position:absolute; left:5%; right:5%; bottom:5%; text-align:center; pointer-events:none; }
  #cct { display:inline-block; background:rgba(12,14,18,.78); color:#fff; border-radius:8px; padding:6px 14px; font-size:clamp(14px,2.1vw,24px); line-height:1.35; }
  #cct:empty { display:none; }
  .bar { display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap; }
  .dots { display:flex; gap:6px; flex:1; min-width:160px; }
  .dots button { flex:1; height:8px; border-radius:4px; border:0; background:var(--line); cursor:pointer; padding:0; }
  .dots button.done { background:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .dots button.on { background:var(--accent); }
  button.ctl, select { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:10px; padding:7px 12px; cursor:pointer; }
  button.ctl[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  aside { background:var(--card); border-radius:18px; border:1px solid var(--line); padding:22px; display:flex; flex-direction:column; gap:16px; }
  .num { display:flex; align-items:flex-end; gap:10px; }
  .num b { font-size:84px; line-height:.9; font-weight:700; }
  .num span { color:var(--mute); padding-bottom:8px; }
  h2 { font-size:26px; line-height:1.25; margin:0; font-weight:600; }
  .say { color:var(--mute); margin:0; }
  .needs { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  .needs li { padding:8px 0; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  .needs .pic { border:0; padding:0; background:none; cursor:zoom-in; border-radius:8px; flex:none; display:block; }
  .needs .pic:focus-visible, .manual:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .needs img { width:72px; height:54px; object-fit:contain; background:var(--bg); border-radius:8px; display:block; }
  figure { margin:0; }
  .manual { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; cursor:zoom-in; padding:0; width:100%; font:inherit; text-align:left; display:block; }
  .manual span { display:block; font-size:13px; color:#6b6f76; padding:8px 12px; border-bottom:1px solid #eee; }
  .manual img { display:block; width:100%; max-height:260px; object-fit:contain; }
  #zoom img { max-height:78vh; object-fit:contain; background:var(--bg); }
  #zoom img.paper { background:#fff; }
  .needs .nm { flex:1; display:flex; flex-direction:column; }
  .needs small { color:var(--mute); font-size:12px; }
  @media (pointer:coarse) { #keys { display:none; } }
  .needs li i { font-style:normal; color:var(--mute); }
  .count { font-size:14px; color:var(--mute); }
  .tip { margin:0; font-size:14px; border-left:3px solid var(--accent); padding:2px 0 2px 10px; }
  .flag { margin:0; font-size:13px; background:color-mix(in srgb, var(--accent) 14%, var(--card)); border-radius:8px; padding:8px 10px; }
  .est { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; margin:-6px 0 0; }
  .est::before { content:""; width:16px; height:16px; flex:none; border:2px solid var(--accent); border-radius:50%;
                 background:linear-gradient(var(--accent),var(--accent)) 50% 28%/2px 5px no-repeat, linear-gradient(var(--accent),var(--accent)) 62% 50%/4px 2px no-repeat; }
  .est.step { font-weight:400; color:var(--mute); }
  .est[hidden] { display:none; }
  .nav { display:flex; gap:10px; }
  .nav button, .wide { flex:1; font:inherit; font-weight:600; border-radius:12px; padding:14px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink); }
  .nav button.next { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); flex:2; }
  .nav button:disabled { opacity:.4; cursor:default; }
  .wide { width:100%; }
  .links { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:14px; font-size:15px; }
  .links a { text-decoration:none; display:flex; justify-content:space-between; gap:12px; padding:4px 0; }
  .links a:hover { color:var(--accent); }
  .links a span { color:var(--mute); }
  .note { font-size:13px; color:var(--mute); margin:0; }
  footer { max-width:1500px; margin:0 auto; padding:8px 24px 32px; font-size:13px; color:var(--mute); }
  footer p { margin:6px 0; max-width:1000px; }
  dialog { border:0; border-radius:14px; padding:0; max-width:min(94vw,1100px); background:var(--card); color:var(--ink); }
  dialog img { display:block; width:100%; }
  dialog .cap { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px; font-size:14px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }

  #v3d { position:relative; width:100%; aspect-ratio:16/9; background:#cbb89a; overflow:hidden; }
  #gl { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #gl:active { cursor:grabbing; }
  #resetview { position:absolute; right:12px; top:12px; font:inherit; font-size:14px; border:0; border-radius:10px; padding:7px 12px; cursor:pointer;
               background:rgba(12,14,18,.72); color:#fff; }
  #resetview[hidden], #hint[hidden], #nogl[hidden] { display:none; }
  #hint { position:absolute; left:12px; top:12px; font-size:13px; border-radius:10px; padding:6px 11px; background:rgba(12,14,18,.6); color:#fff; pointer-events:none; }
  .nogl #big { display:none; }
  #nogl { position:absolute; inset:0; z-index:2; display:grid; place-content:center; gap:8px; text-align:center; padding:20px; background:#cbb89a; color:#22242a; }
</style>
</head>
<body>
<header>
  <h1 id="h1"></h1><span class="badge" id="badge"></span>
  <div class="right">
    <div class="lang" role="group" aria-label="Language"><button id="l-en" aria-pressed="false">EN</button><button id="l-zh" aria-pressed="false">中文</button></div>
    <a class="home" href="/">yizhouyu.dev</a>
  </div>
</header>
<main>
  <section class="stage">
    <div class="screen"><div id="v3d"><canvas id="gl"></canvas><div id="hint"></div><button id="resetview" hidden></button><div id="nogl" hidden><b id="nogl-t"></b><a id="nogl-a" href="../ikea-kallax/"></a></div></div><div id="cc"><span id="cct"></span></div>
      <div id="big" hidden><svg viewBox="0 0 24 24" id="bigicon"></svg></div><div id="prog"><i id="progbar"></i></div></div>
    <div class="bar">
      <div class="dots" id="dots"></div>
      <button class="ctl" id="pp"><svg viewBox="0 0 24 24" id="ppicon"></svg></button>
      <button class="ctl" id="replay"></button>

      <button class="ctl" id="ccbtn" aria-pressed="true">CC</button>
      <button class="ctl" id="sound" aria-pressed="true"></button>
      <button class="ctl" id="auto" aria-pressed="false"></button>
      <button class="ctl" id="voice" aria-pressed="false" hidden></button>
    </div>
  </section>
  <aside>
    <div class="num"><b id="num"></b><span id="of"></span></div>
    <h2 id="title"></h2>
    <p class="est" id="est"></p>
    <p class="say" id="say"></p>
    <ul class="needs" id="needs"></ul>
    <p class="tip" id="tip" hidden></p>
    <p class="flag" id="flag" hidden></p>
    <div class="count" id="count"></div>
    <div class="nav"><button id="prev"></button><button class="next" id="next"></button></div>
    <button class="wide" id="showdone"></button>
    <button class="manual" id="manual"><span id="mcap"></span><img id="mpage" alt=""></button>
    <p class="note" id="ai" hidden></p>
    <div class="links">
      <a href="https://www.ikea.com/us/en/p/kallax-shelf-unit-white-20631639/" target="_blank" rel="noopener"><b id="lk-product" style="font-weight:inherit"></b> <span>↗</span></a>
      <a href="https://www.ikea.com/us/en/assembly_instructions/kallax-shelf-unit-white__AA-2703308-1-100.pdf" target="_blank" rel="noopener"><b id="lk-manual" style="font-weight:inherit"></b> <span>↗</span></a>
    </div>
    <p class="note" id="vstat" hidden></p>
    <p class="note" id="keys"></p>
  </aside>
</main>
<footer id="foot"></footer>
<dialog id="done"><img src="finished.jpg" alt="3D render of the finished KALLAX 2×2 shelf unit standing upright">
  <div class="cap"><span id="donecap"></span><button class="ctl" id="closedone"></button></div></dialog>
<dialog id="zoom"><img id="zoomimg" alt=""><div class="cap"><span id="zoomcap"></span><button class="ctl" id="closezoom"></button></div></dialog>
