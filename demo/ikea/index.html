<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KALLAX step by step · unofficial demo</title>
<meta name="description" content="An unofficial, independent demo: a picture-only assembly manual turned into a step-by-step 3D guide.">
<style>
  :root { --bg:#f4f1ec; --card:#ffffff; --ink:#22242a; --mute:#6b6f76; --line:#e4dfd6; --accent:#e07a12; --accent-ink:#ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#17181b; --card:#212327; --ink:#f1efe9; --mute:#a3a7ae; --line:#34373d; --accent:#f08a24; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif; }
  a { color:inherit; }
  header { display:flex; align-items:center; gap:12px; padding:18px 24px 6px; flex-wrap:wrap; max-width:1500px; margin:0 auto; }
  header h1 { font-size:20px; margin:0; font-weight:600; }
  .badge { font-size:12px; font-weight:600; letter-spacing:.02em; border:1px solid var(--line); border-radius:6px; padding:2px 8px; color:var(--mute); }
  .right { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .lang { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .lang button { font:inherit; font-size:14px; border:0; background:transparent; color:var(--mute); padding:5px 12px; cursor:pointer; }
  .lang button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  header .home { font-size:14px; color:var(--mute); text-decoration:none; }
  main { display:grid; align-items:start; grid-template-columns:minmax(0,1fr) 380px; gap:20px; padding:12px 24px 8px; max-width:1500px; margin:0 auto; }
  @media (max-width: 980px) { main { grid-template-columns:1fr; padding:12px 16px 8px; } }
  .stage { background:var(--card); border-radius:18px; overflow:hidden; border:1px solid var(--line); }
  .screen { position:relative; }
  video { display:block; width:100%; aspect-ratio:16/9; background:#cbb89a; }
  #cc { position:absolute; left:5%; right:5%; bottom:5%; text-align:center; pointer-events:none; }
  #cct { display:inline-block; background:rgba(12,14,18,.78); color:#fff; border-radius:8px; padding:6px 14px; font-size:clamp(14px,2.1vw,24px); line-height:1.35; }
  #cct:empty { display:none; }
  .bar { display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap; }
  .dots { display:flex; gap:6px; flex:1; min-width:160px; }
  .dots button { flex:1; height:8px; border-radius:4px; border:0; background:var(--line); cursor:pointer; padding:0; }
  .dots button.done { background:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .dots button.on { background:var(--accent); }
  button.ctl, select { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:10px; padding:7px 12px; cursor:pointer; }
  button.ctl[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  aside { background:var(--card); border-radius:18px; border:1px solid var(--line); padding:22px; display:flex; flex-direction:column; gap:16px; }
  .num { display:flex; align-items:flex-end; gap:10px; }
  .num b { font-size:84px; line-height:.9; font-weight:700; }
  .num span { color:var(--mute); padding-bottom:8px; }
  h2 { font-size:26px; line-height:1.25; margin:0; font-weight:600; }
  .say { color:var(--mute); margin:0; }
  .needs { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  .needs li { padding:10px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
  .needs li i { font-style:normal; color:var(--mute); }
  .count { font-size:14px; color:var(--mute); }
  .nav { display:flex; gap:10px; }
  .nav button, .wide { flex:1; font:inherit; font-weight:600; border-radius:12px; padding:14px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink); }
  .nav button.next { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); flex:2; }
  .nav button:disabled { opacity:.4; cursor:default; }
  .wide { width:100%; }
  .links { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:14px; font-size:15px; }
  .links a { text-decoration:none; display:flex; justify-content:space-between; gap:12px; padding:4px 0; }
  .links a:hover { color:var(--accent); }
  .links a span { color:var(--mute); }
  .note { font-size:13px; color:var(--mute); margin:0; }
  footer { max-width:1500px; margin:0 auto; padding:8px 24px 32px; font-size:13px; color:var(--mute); }
  footer p { margin:6px 0; max-width:1000px; }
  dialog { border:0; border-radius:14px; padding:0; max-width:min(94vw,1100px); background:var(--card); color:var(--ink); }
  dialog img { display:block; width:100%; }
  dialog .cap { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px; font-size:14px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
</style>
</head>
<body>
<header>
  <h1 id="h1"></h1><span class="badge" id="badge"></span>
  <div class="right">
    <div class="lang" role="group" aria-label="Language"><button id="l-en" aria-pressed="false">EN</button><button id="l-zh" aria-pressed="false">中文</button></div>
    <a class="home" href="/">yizhouyu.dev</a>
  </div>
</header>
<main>
  <section class="stage">
    <div class="screen"><video id="v" playsinline muted></video><div id="cc"><span id="cct"></span></div></div>
    <div class="bar">
      <div class="dots" id="dots"></div>
      <button class="ctl" id="replay"></button>
      <select id="speed" aria-label="Speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
      <button class="ctl" id="ccbtn" aria-pressed="true">CC</button>
      <button class="ctl" id="sound" aria-pressed="true"></button>
      <button class="ctl" id="auto" aria-pressed="false"></button>
      <button class="ctl" id="voice" aria-pressed="false" hidden></button>
    </div>
  </section>
  <aside>
    <div class="num"><b id="num"></b><span id="of"></span></div>
    <h2 id="title"></h2>
    <p class="say" id="say"></p>
    <ul class="needs" id="needs"></ul>
    <div class="count" id="count"></div>
    <div class="nav"><button id="prev"></button><button class="next" id="next"></button></div>
    <button class="wide" id="showdone"></button>
    <p class="note" id="ai" hidden></p>
    <div class="links">
      <a href="https://www.ikea.com/us/en/p/kallax-shelf-unit-white-20631639/" target="_blank" rel="noopener"><b id="lk-product" style="font-weight:inherit"></b> <span>↗</span></a>
      <a href="https://www.ikea.com/us/en/assembly_instructions/kallax-shelf-unit-white__AA-2703308-1-100.pdf" target="_blank" rel="noopener"><b id="lk-manual" style="font-weight:inherit"></b> <span>↗</span></a>
    </div>
    <p class="note" id="vstat" hidden></p>
    <p class="note" id="keys"></p>
  </aside>
</main>
<footer id="foot"></footer>
<dialog id="done"><img src="finished.jpg" alt="3D render of the finished KALLAX 2×2 shelf unit standing upright">
  <div class="cap"><span id="donecap"></span><button class="ctl" id="closedone"></button></div></dialog>
<audio id="a"></audio>

const $ = id => document.getElementById(id);
const v = $("v"), a = $("a"), cc = $("cct");
const q = new URLSearchParams(location.search);
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, x) => { try { localStorage.setItem(k, x); } catch (e) {} } };
let lang = q.get("lang") || store.get("lang") || ((navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en");
if (!DATA[lang]) lang = "en";
let i = 0, sound = true, auto = false, timer = null, captions = store.get("cc") !== "off", hands = false, rec = null;
const N = DATA.en.length, total = DATA.en.filter(s => s.num).length;
const S = () => DATA[lang], T = () => UI[lang];
for (let n = 0; n < N; n++) { const b = document.createElement("button"); b.onclick = () => go(n); $("dots").appendChild(b); }

function labels() {   // everything that does not depend on the step
  const t = T();
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t.doc;
  $("h1").textContent = t.h1; $("badge").textContent = t.badge;
  $("replay").textContent = t.replay; $("auto").textContent = t.auto;
  $("sound").textContent = sound ? t.voiceOn : t.voiceOff;
  $("voice").textContent = t.hands; $("voice").title = t.handsTitle; $("ccbtn").title = t.ccTitle;
  $("prev").textContent = t.back; $("showdone").textContent = t.finished;
  $("donecap").textContent = t.finishedCap; $("closedone").textContent = t.close;
  $("lk-product").textContent = t.product; $("lk-manual").textContent = t.manual;
  $("ai").textContent = t.ai; $("keys").textContent = t.keys;
  $("foot").innerHTML = t.foot.map(p => `<p>${p}</p>`).join("");
  $("l-en").setAttribute("aria-pressed", lang === "en"); $("l-zh").setAttribute("aria-pressed", lang === "zh");
  [...$("dots").children].forEach((b, n) => b.title = S()[n].title);
  if (hands) $("vstat").textContent = t.listening;
}
function go(n) {
  i = Math.max(0, Math.min(N - 1, n));
  const s = S()[i], t = T();
  clearTimeout(timer);
  $("num").textContent = s.num ?? (i === 0 ? t.first : t.last);
  $("num").style.fontSize = s.num ? "" : "44px";
  $("of").textContent = s.num ? "/ " + total : s.label;
  $("title").textContent = s.title;
  $("say").textContent = s.say;
  $("needs").innerHTML = s.needs.map(x => { const m = x.match(/^(.*?)\s*×\s*(\d+)$/); return m ? `<li>${m[1]}<i>× ${m[2]}</i></li>` : `<li>${x}</li>`; }).join("");
  $("count").textContent = i === 0 ? "" : t.used.replace("{d}", s.dowel).replace("{s}", s.screw);
  $("ai").hidden = !s.ai;
  $("prev").disabled = i === 0;
  $("next").textContent = i === N - 1 ? t.over : (i === 0 ? t.start : t.next);
  [...$("dots").children].forEach((b, k) => b.className = k === i ? "on" : k < i ? "done" : "");
  if (!v.src.endsWith(`clips/${s.key}.mp4`)) v.src = `clips/${s.key}.mp4`;
  a.src = `audio/${lang}/${s.key}.mp3`;
  play();
}
function play() {
  const rate = parseFloat($("speed").value);
  v.currentTime = 0; v.playbackRate = rate; v.play().catch(() => {});
  a.pause(); a.currentTime = 0; a.playbackRate = rate;
  clearTimeout(timer);
  if (sound) timer = setTimeout(() => a.play().catch(() => {}), S()[i].voOffset * 1000 / rate);
  drawCaption();
}
// captions follow the picture's own clock, so they stay in step at any speed and with the voice off
function drawCaption() {
  const t = v.currentTime, c = S()[i].caps.find(c => t >= c[0] && t < c[1]);
  cc.textContent = captions && c ? c[2] : "";
}
function setCaptions(on) { captions = on; $("ccbtn").setAttribute("aria-pressed", on); store.set("cc", on ? "on" : "off"); drawCaption(); }
function setLang(l) { if (l === lang) return; lang = l; store.set("lang", l); labels(); go(i); if (hands) startListening(); }
v.ontimeupdate = drawCaption;
v.onended = () => { cc.textContent = ""; if (auto && i < N - 1) timer = setTimeout(() => go(i + 1), 1200); };
$("next").onclick = () => go(i === N - 1 ? 0 : i + 1);
$("prev").onclick = () => go(i - 1);
$("replay").onclick = play;
$("speed").onchange = play;
$("ccbtn").onclick = () => setCaptions(!captions);
$("sound").onclick = () => { sound = !sound; $("sound").setAttribute("aria-pressed", sound); $("sound").textContent = sound ? T().voiceOn : T().voiceOff; if (!sound) a.pause(); };
$("auto").onclick = e => { auto = !auto; e.target.setAttribute("aria-pressed", auto); };
$("showdone").onclick = () => $("done").showModal();
$("closedone").onclick = () => $("done").close();
$("done").onclick = e => { if (e.target === $("done")) $("done").close(); };
$("l-en").onclick = () => setLang("en");
$("l-zh").onclick = () => setLang("zh");
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") go(i + 1); else if (e.key === "ArrowLeft") go(i - 1);
  else if (e.key === " ") { e.preventDefault(); play(); }
  else if (e.key === "c" || e.key === "C") setCaptions(!captions);
});
// hands-free: spoken next / back / again, only where the browser offers speech recognition
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function stopListening() { if (rec) { rec.onend = null; try { rec.stop(); } catch (e) {} rec = null; } }
function startListening() {
  stopListening();
  rec = new SR(); rec.lang = T().sr; rec.continuous = true; rec.interimResults = false;
  rec.onresult = ev => {
    const said = ev.results[ev.results.length - 1][0].transcript, u = T();
    if (new RegExp(u.reNext, "i").test(said)) go(i + 1); else if (new RegExp(u.reBack, "i").test(said)) go(i - 1); else if (new RegExp(u.reAgain, "i").test(said)) play();
  };
  rec.onend = () => { if (hands && rec) try { rec.start(); } catch (e) {} };
  rec.onerror = ev => { if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
    hands = false; $("voice").setAttribute("aria-pressed", false); stopListening(); $("vstat").hidden = false; $("vstat").textContent = T().mic; } };
  try { rec.start(); } catch (e) {}
}
if (SR) {
  $("voice").hidden = false;
  $("voice").onclick = () => {
    hands = !hands; $("voice").setAttribute("aria-pressed", hands);
    $("vstat").hidden = !hands; $("vstat").textContent = T().listening;
    if (hands) startListening(); else stopListening();
  };
}
$("ccbtn").setAttribute("aria-pressed", captions);
labels();
go(Math.max(0, Math.min(N - 1, parseInt(q.get("step") || "0", 10) || 0)));
if (q.get("show") === "finished") $("done").showModal();
</script>
